version: '3.9'
services:
  order_service:
    build: ./server/order-service
    container_name: order_service_container
    ports:
    - 3001:3001
    environment:
    - PORT=3001
    - SERVER_URL=${ORDER_SERVICE_URL:-http://localhost:3001}
    - USER_SERVICE_URL=http://user_service_container:3000
    depends_on:
      user_service:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3001/health
      interval: 30s
      timeout: 10s
      retries: 3
  user_service:
    build: ./server/user-service
    container_name: user_service_container
    ports:
    - 3000:3000
    environment:
    - PORT=3000
    - SERVER_URL=${USER_SERVICE_URL:-http://localhost:3000}
    healthcheck:
      test:
      - CMD
      - wget
      - -qO-
      - http://localhost:3000/health
      interval: 30s
      timeout: 10s
      retries: 3
volumes: {}
