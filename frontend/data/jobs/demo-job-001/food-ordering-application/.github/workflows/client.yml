name: client CI/CD
'on':
  push:
    branches:
    - main
    paths:
    - client/**
    - .github/workflows/client.yml
  pull_request:
    branches:
    - main
    paths:
    - client/**
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: food-ordering/client
  ECS_CLUSTER: food-ordering-cluster
  ECS_SERVICE: client-service
  CONTAINER_NAME: client
  ECS_TASK_DEFINITION: client-service-task
jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      working-directory: ./client
      run: npm ci || npm install
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    - name: Build and push image
      id: build-image
      working-directory: ./client
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: 'docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .

        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest

        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT'
  deploy:
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Download current task definition
      run: "aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION\
        \ }} --query taskDefinition > task-definition-raw.json\npython3 - <<'PY'\n\
        import json\nfrom pathlib import Path\ntd = json.loads(Path('task-definition-raw.json').read_text())\n\
        for key in ['taskDefinitionArn', 'revision', 'status', 'requiresAttributes',\
        \ 'compatibilities', 'registeredAt', 'registeredBy', 'enableFaultInjection']:\n\
        \    td.pop(key, None)\nPath('task-definition.json').write_text(json.dumps(td,\
        \ indent=2))\nPY"
    - id: task-def
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: task-definition.json
        container-name: ${{ env.CONTAINER_NAME }}
        image: ${{ needs.build-and-push.outputs.image }}
    - uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: ${{ steps.task-def.outputs.task-definition }}
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: false
